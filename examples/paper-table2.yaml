# Reproduces the nine charts in the validation table (Table 2) of the
# accompanying publication, across their upstream catalogs. Running
#   task generate-multi MANIFEST=examples/paper-table2.yaml
# regenerates the artifacts and field counts reported there.
product: paper-table2
release: v1
charts:
  - repo: https://stefanprodan.github.io/podinfo
    name: podinfo
    version: "6.7.1"
    app_name: podinfo
  - repo: oci://registry-1.docker.io/bitnamicharts
    name: rabbitmq
    version: "16.0.0"
    app_name: rabbitmq
  - repo: https://hazelcast-charts.s3.amazonaws.com
    name: hazelcast
    version: "5.10.0"
    app_name: hazelcast
  # microservices-demo (Google Online Boutique) is vendored locally — it is
  # published as source, not via a Helm repository. See examples/charts/.
  - repo: examples/charts/microservices-demo
    name: onlineboutique
    version: "0.10.6"
    app_name: microservices-demo
  - repo: https://prometheus-community.github.io/helm-charts
    name: prometheus
    version: "29.17.0"
    app_name: prometheus
  - repo: https://grafana.github.io/helm-charts
    name: grafana
    version: "12.7.2"
    app_name: grafana
  - repo: https://helm.releases.hashicorp.com
    name: vault
    version: "0.34.0"
    app_name: vault
  - repo: https://kubernetes.github.io/ingress-nginx
    name: ingress-nginx
    version: "4.15.1"
    app_name: ingress-nginx
  - repo: https://charts.jetstack.io
    name: cert-manager
    version: "v1.21.0"
    app_name: cert-manager
