deployments:
  - name: demo-app
    enabled: true
    replicaCount: 2
    containers:
      - name: app
        image:
          repository: docker.io/nginxinc/nginx-unprivileged
          tag: "1.27-alpine"
        ports:
          - name: http
            containerPort: 8080
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        volumeMounts:
          - name: app-config
            mountPath: /usr/share/nginx/html
            readOnly: true
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 3
    volumes:
      - name: app-config
        configMap:
          name: demo-app-content

services:
  - name: demo-app
    enabled: true
    type: ClusterIP
    ports:
      - name: http
        port: 80
        targetPort: 8080
    selector:
      app.kubernetes.io/name: base-chart
      app.kubernetes.io/instance: demo-app

configmaps:
  - name: demo-app-content
    enabled: true
    data:
      index.html: |
        <!DOCTYPE html>
        <html><body><h1>Demo App</h1><p>Deployed via KLASP</p></body></html>
