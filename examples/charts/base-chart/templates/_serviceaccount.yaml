{{- define "base-chart.serviceaccount" -}}
{{- if .Values.serviceAccounts }}
{{- range .Values.serviceAccounts }}
{{- if .enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ required "ServiceAccount name is required" .name }}
  namespace: {{ .namespace | default $.Release.Namespace }}
  labels:
    {{- include "base-chart.labels" $ | nindent 4 }}
    {{- with .labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- if or $.Values.commonAnnotations .annotations }}
  annotations:
    {{- include "base-chart.annotations" $ | nindent 4 }}
    {{- with .annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
{{- with .imagePullSecrets }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- with .secrets }}
secrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
automountServiceAccountToken: {{ .automountServiceAccountToken | default true }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
