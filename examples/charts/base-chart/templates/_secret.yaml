{{- define "base-chart.secret" -}}
{{- if .Values.secrets }}
{{- range .Values.secrets }}
{{- if .enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ required "Secret name is required" .name }}
  namespace: {{ .namespace | default $.Release.Namespace }}
  labels:
    {{- include "base-chart.labels" $ | nindent 4 }}
    {{- with .labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- if or $.Values.commonAnnotations .annotations }}
  annotations:
    {{- include "base-chart.annotations" $ | nindent 4 }}
    {{- with .annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
type: {{ .type | default "Opaque" }}
{{- with .data }}
data:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- with .stringData }}
stringData:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
